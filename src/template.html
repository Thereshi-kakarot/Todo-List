<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-App</title>
</head>
<body>
    <nav id="navbar">
    <h2>To-Do-App</h2>
    <button type="button" id="add-project">Add Project +</button>
   </nav>
    <div id="container">

        <aside>
          <div id="project">
            <h3 id="project-name">Default Project</h3>
            <button type="button" id="del-project">X</button>
          </div>  
        </aside>
        <button type="button" id="add-todo">Add Todo +</button>

        <dialog id="project-modal">
          <form action="">
            <label for="project-name"> <input type="text" id="project-name" name="project-name" required></label>
          </form>
          <button type="button" id="add-project-modal-btn"></button>
          <button type="button" id="close-modal">Close</button>
        </dialog>
        <form action="" id="todo-form">
          <label for="todo-title"><input type="text" id="todo-title" name="todo-title" title="todo-title" required></label>
          <label for="todo-description"><input type="text" id="todo-description" name="todo-description" title="todo-description"></label>
          <label for="todo-due-date"><input type="date" id="todo-due-date" name="todo-due-date" title="todo-due-date" required></label>
          <select name="priority-select" id="priority-select" title="priority-select">
            <option value="priority-level" disabled >Priority Level</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </form>
    </div>
</body>
</html>
