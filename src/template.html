<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-App</title>
</head>
<body>
    <nav id="navbar">
    <h2>To-Do-App</h2>
    <button type="button" id="add-project">Add Project +</button>
   </nav>
    <div id="container">
        <div id="app-layout">
          <aside id="aside-container">
          <div class="project-wrapper">
            <div class="project">
            <h3 class="project-name">Default Project</h3>
          </div>  
          <button type="button" class="del-project">X</button>
          </div>
        </aside>
        <div id="todo-section">
           <div id="todo-list"></div>
        <button type="button" class="add-todo">Add Todo +</button>
        </div>

       

        </div>
        
        <dialog id="project-modal">
          <form action="">
            <label for="project-title"> <input type="text" id="project-title" name="project-title" required></label>
          </form>
          <div class="modal-btns">
            <button type="button" id="add-project-modal-btn">Add Project</button>
          <button type="button" id="close-project-modal-btn">Close</button>
          </div>
        </dialog>
        <form action="" id="todo-form">
          <label for="todo-title"><input type="text" id="todo-title" name="todo-title" title="todo-title" placeholder="Title" required></label>
          <label for="todo-description"><input type="text" id="todo-description" name="todo-description" title="todo-description" placeholder="Description"></label>
          <label for="todo-due-date"><input type="date" id="todo-due-date" name="todo-due-date" title="todo-due-date" required></label>
          <select name="priority-select" id="priority-select" title="priority-select">
            <option value="priority-level" disabled >Priority Level</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <div id="form-btns">
            <button type="button" id="submit-todo">Submit Todo</button>
        <button type="button" class="close-todo-form">Close</button>
          </div>
        </form>
        
    </div>
</body>
</html>
